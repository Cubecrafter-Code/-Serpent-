<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schlange</title>
    <canvas id="canvas1" width="320" height="180"></canvas>

    <div id="scoreDiv">
      <header class="scoreText">Punktzahl:</header>
      <p class="scoreText" id="score">0</p>
    </div>

    <button class="pauseButton" onclick="pauseGame()">
      <div class="pauseIcon" onclick="pauseGame()"></div>
    </button>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;

        touch-action: none;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100dvh; /* important */
        background: #3f2800; /* so “white area” isn’t visible */
      }

      canvas {
        background-color: #3f2800; /*00*/
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        user-select: none;
        display: block;
      }

      #scoreDiv {
        position: absolute;
        top: 10px;
        left: 10px;
        background: black;
        width: 250px;
      }

      .scoreText {
        top: 10px;
        position: absolute;
        max-width: 100%;

        font-size: 42px;
        color: aqua;
        font-weight: bold;
        pointer-events: none;
        -webkit-text-stroke: 2px aqua;
        white-space: nowrap; /* no wrapping */
        overflow: hidden; /* hide overflow */
        text-overflow: ellipsis;
        margin: 0;
      }

      #scoreBox {
        position: absolute;
        left: 10px;
      }

      #score {
        top: 50px;
      }

      .pauseButton {
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 10px;
        right: 10px;
        border-radius: 5%;
      }

      .pauseIcon {
        width: 20px;
        height: 24px;
        position: relative;
        display: flex;
        justify-content: space-between;
      }

      .pauseIcon::before,
      .pauseIcon::after {
        content: "";
        width: 6px;
        height: 100%;
        background-color: #fff;
        border-radius: 2px;
      }
    </style>
  </head>
  <body onload="Game()">
    <div class="menu" id="mainMenu">
      <header id="menuText"></header>
      <div id="buttonDiv"></div>
    </div>
    <style>
      /** {
              outline: 1px solid red;
            }*/

      [hidden] {
        display: none !important;
      }

      #mainMenu {
        position: absolute;
        width: 500px;
        left: 50%;
        transform: translateX(-50%);
        top: 100px;

        background: linear-gradient(
          90deg,
          rgba(210, 105, 30, 0.5),
          rgba(255, 0, 0, 0.5),
          rgba(210, 105, 30, 0.5)
        );
        display: flex;
        flex-direction: column;
        text-align: center;
        font-size: 48px;
        font: bold;
        font-family: monospace;
        color: rgb(0, 0, 0);
        font-weight: bold;
        pointer-events: none;
        -webkit-text-stroke: 2px black;

        height: 75%;
        border-radius: 20px;
        pointer-events: all;

        border-style: solid;
        border-color: rgba(0, 0, 255, 0.5);
        border-width: 10px;
        transition: width 0.3s ease;
      }

      #mainMenu.expanded {
        width: 90%;
      }

      #buttonDiv {
        overflow-y: auto;
        overscroll-behavior: contain;
        flex: 1;
        pointer-events: all;
        display: flex;
        flex-direction: column;
      }

      #menuText {
        margin-top: 25px;
      }

      .menuButton {
        padding: 10px;
        font-size: 48px;
        font-family: monospace;
        height: fit-content;
        background: linear-gradient(cyan, #00c0c0, cyan);
        border: solid;
        border-color: blueviolet;
        border-width: 5px;
        border-radius: 20px;
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        white-space: nowrap;
        /*flex: 1;it-content*/
        margin: 10px;

        pointer-events: all;
      }

      .wrapper {
        display: flex;
      }

      .input {
        flex: 1;
        min-width: 0;
        margin-right: 0;
      }

      .wrapper.state0 input,
      .wrapper.state0 button:nth-of-type(2) {
        display: none;
      }

      .wrapper.state1 button:nth-of-type(1) {
        display: none;
      }
      .wrapper button:nth-of-type(1) {
        flex: 1;
      }

      .chooseButtonDiv {
        display: flex;

        background: linear-gradient(cyan, #00c0c0, cyan);
        border: solid;
        border-color: blueviolet;
        border-width: 5px;
        border-radius: 20px;

        font-size: 48px;
        font-family: monospace;
        font-weight: normal !important;
        margin: 10px;
        align-items: center;
        justify-content: center;
      }

      .chooseButtonDiv div button {
        justify-self: right;
        margin: 0px;
        background: rgba(0, 0, 0, 0.1);

        font-size: 48px;
        font-family: monospace;
        flex: 1;
        height: fit-content;

        border-style: none none none solid;
        border-color: #660000;
      }

      .chooseButtonDiv p {
        margin: 10px;
      }

      .chooseButtonDiv div {
        display: flex;
        flex: 1;
        margin-right: 10px;

        background: #ff0000;
        border: solid;
        border-color: #8866dd;
        border-width: 3px;
        border-radius: 20px;

        overflow: hidden;
      }

      .chooseButtonDiv div button:nth-of-type(1) {
        border: none;
      }

      .chooseButtonDiv .selected {
        color: white;
        background: linear-gradient(#990000, #550000, #990000);
      }

      .sliderContainer {
        display: flex;
        background-color: black;
        margin: 10px;
        padding: 10px;
        align-self: stretch;
        background: linear-gradient(cyan, #00c0c0, cyan);
        border: solid;
        border-color: blueviolet;
        border-width: 5px;
        border-radius: 20px;
        justify-items: center;
        align-items: center;
        padding: 10px;
      }

      .sliderContainer p {
        padding-right: 10px;
        margin: 0;
        width: fit-content;
        white-space: pre;
      }

      .sliderContainer input {
        width: stretch;
      }

      .gridContainer {
        padding: 10px;

        flex: 1;

        height: fit-content;
        background: linear-gradient(cyan, #00c0c0, cyan);
        border: solid;
        border-color: blueviolet;
        border-width: 5px;
        border-radius: 20px;

        display: grid;
        grid-gap: 10px;
        grid-template-columns: repeat(4, minmax(1px, 1fr));
        grid-auto-rows: min-content;

        margin: 10px;
      }

      .gridContainer .gridSection {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: subgrid;

        background: linear-gradient(90deg, pink, magenta, pink);
        padding: 10px;
        margin: 10px;
        min-height: 0;

        border: solid;
        border-color: purple;
        border-width: 5px;
        border-radius: 20px;
        justify-items: center;
      }

      .gridContainer .gridSectionHeader {
        grid-column: 1/-1;
        background: linear-gradient(yellow, orange, yellow);
        padding: 10px;
        border: solid;
        border-color: blueviolet;
        border-width: 5px;
        border-radius: 20px;
        top: 10px;
        position: sticky;
        width: fit-content;
      }

      .gridSectionRow {
        grid-column: span 4;
        display: grid;
        grid-template-columns: subgrid;
        grid-auto-rows: max-content;
        grid-gap: 10px;

        margin: 20px;
        min-height: 0;

        background: linear-gradient(lime, rgb(13, 134, 64), lime);

        border: solid;
        border-color: green;
        border-width: 5px;
        border-radius: 20px;

        overflow: hidden;
        align-items: center;
        justify-items: center;
      }

      .gridSectionRow div {
        width: 100%;

        contain: size;
        overflow-y: scroll;
        align-content: center;

        scrollbar-width: thin;

        min-height: 0;
        height: 100%;
      }

      .gridSectionRow div p {
        margin: 0;
        height: fit-content;
        word-wrap: break-word;
      }

      .gridSectionRow button {
        width: 100%;
      }

      .table {
        border-collapse: collapse;
        color: rgb(0, 0, 0);
        -webkit-text-stroke-width: 0;

        overflow: hidden;
        margin: 10px;
        table-layout: fixed;
        text-align: center;
        border: 10px, solid, black;
        border-radius: 20px;
        border-collapse: separate;
        border-spacing: 0;

        border: 3px solid #ff0000;
        border-radius: 10px;
        box-shadow: 0 0 0 4px black;
      }
      .tableRow {
        border-bottom: 1px solid #ddd;
      }
      .tableData {
        padding: 5px;
        text-align: center;
        font-size: 24px;
        background: linear-gradient(90deg, #00abab, darkcyan);
        border-bottom: 2px solid rgba(0, 0, 0, 0.1);
      }
      .table th {
        background: linear-gradient(90deg, #555555, #111111);
        color: white;
        font-weight: bold;
      }

      #leaderboardTable .tableRow:nth-child(2) td {
        background: linear-gradient(90deg, #ffd700, #ffb300);
        color: #222;
        font-weight: bold;
      }

      #leaderboardTable .tableRow:nth-child(3) td {
        background: linear-gradient(90deg, #c0c0c0, #9e9e9e);
        color: #222;
        font-weight: bold;
      }

      #leaderboardTable .tableRow:nth-child(4) td {
        background: linear-gradient(90deg, #cd7f32, #a65e2e);
        color: #222;
        font-weight: bold;
      }

      #leaderboardTable .tableRow:last-of-type td {
        background: linear-gradient(90deg, #7cfc00, #00ff00);
        color: #222;
        font-weight: bold;
      }
      #leaderboardTable .tableRow:nth-child(2) td,
      #leaderboardTable .tableRow:nth-child(3) td,
      #leaderboardTable .tableRow:nth-child(4) td {
        border-bottom: 3px solid rgba(0, 0, 0, 0.2);
      }
    </style>
    <script>
      const path = `/${window.location.pathname.split("/")[1]}/`;
      let canvas = document.getElementById("canvas1");
      let ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;

      function resizeCanvas() {
        const baseWidth = canvas.width;
        const baseHeight = canvas.height;

        const scale = Math.min(
          window.innerWidth / baseWidth,
          window.innerHeight / baseHeight,
        );

        canvas.style.width = baseWidth * scale + "px";
        canvas.style.height = baseHeight * scale + "px";

        deviceInfo = {
          width: window.innerWidth,
          height: window.innerHeight,

          aspectRatio: window.innerWidth / window.innerHeight,
        };
        console.log(deviceInfo.aspectRatio);
        settings.controls.swipeThreshold.val =
          (deviceInfo.aspectRatio < canvas.width / canvas.height
            ? deviceInfo.width
            : deviceInfo.height) /
          (1.0112 * 1.047018 ** settings.controls.swipeThreshold.mult -
            0.0587) /
          10;
      }

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", () => {
        setTimeout(resizeCanvas, 100);
      });

      window.addEventListener("keydown", (e) => {
        if (
          ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(
            e.code,
          )
        ) {
          e.preventDefault();
        }
      });

      canvas.tabIndex = 0;
      canvas.focus();

      let deviceInfo = {
        width: canvas.getBoundingClientRect().width,
        height: canvas.getBoundingClientRect().height,
        /*resulutionMult:
                screen.height / document.getElementById("canvas1").height,*/
        aspectRatio:
          canvas.getBoundingClientRect().width /
          canvas.getBoundingClientRect().height,
      };

      let css = {
        mainMenu: document.getElementById("mainMenu"),
        menuText: document.getElementById("menuText"),
        menuButtons: document.getElementsByClassName("menuButton"),
        tables: {},
      };

      css.mainMenu.buttonDiv = document.getElementById("buttonDiv");

      let debugCounter = 0;
      let placeholderCount = 0;
      function placeholder() {
        console.error(new Error(`placeholder: ${placeholderCount}`));
        return `${placeholderCount++}`;
      }

      let Key = {
        state: {
          up: false,
          left: false,
          down: false,
          right: false,

          swipe: false,
        },
        functions: {
          pause: pauseGame,
          /*scoreUp: function () {
            Snake.segmentCount++;
          },*/
        },
      };

      let Keybinds;

      let leaderboardArr = localStorage.getItem("leaderboardArray")
        ? JSON.parse(localStorage.getItem("leaderboardArray"))
        : [
            { name: "-", score: 0 },
            { name: "-", score: 0 },
            { name: "-", score: 0 },
            { name: "-", score: 0 },
            { name: "-", score: 0 },
            { name: "-", score: 0 },
            { name: "-", score: 0 },
            { name: "-", score: 0 },
            { name: "-", score: 0 },
            { name: "-", score: 0 },

            { name: "-", score: 0 },
          ];

      let tickCounter = 0;
      let alive = false;
      let start = true;
      let updateloop;
      let directionChange;

      let map = {
        start_x: 40,
        start_y: 10,
        width: 240,
        height: 160,
        tile_length: 10,
        appleCout: 2,
      };

      let backgroundImage = new Image();
      let bufferDirection;
      let Snake = {
        x: 80,
        y: 80,
        last: { x: 80, y: 80 },
        nextAngle: 0,
        bufferAngle: 0,
        angle: 0,
        segmentCount: 4,
        startSegmentCount: 4,
        width: map.tile_length,
        height: map.tile_length,
        src: `${path}textures/Spreadsheet.png`,
        srcCoords: { x: 10, y: 0 },
      };

      let SnakeSegments = [];

      let tiles = [];
      for (let b = 0; b < map.width / map.tile_length; b++) {
        for (let c = 0; c < map.height / map.tile_length; c++) {
          let tileObj = {
            name: `tileObj_${b}_${c}`,
            x: b * map.tile_length,
            y: c * map.tile_length,
            state: "free",
          };
          tiles.push(tileObj);
        }
      }

      let Apples = [];

      let appleGrow = false;

      let touch = {
        lastpos: { x: 0, y: 0 },
        currentpos: { x: 0, y: 0 },
      };

      let settings = JSON.parse(
        localStorage.getItem("settings") === null
          ? "{}"
          : localStorage.getItem("settings"),
      );

      document.onkeydown = function (e) {
        if (e.repeat === false) {
          keyHandler(e.code, true);
        }
      };

      document.onkeyup = function (e) {
        keyHandler(e.code, false);
      };

      function keyHandler(inputKey, state) {
        Key.state.up =
          Key.state.left =
          Key.state.down =
          Key.state.right =
            false;
        //console.log(Key);
        if (Keybinds.state?.[inputKey] !== undefined) {
          Key.state[Keybinds.state?.[inputKey]] = state;
        }
        if (
          state &&
          Key.functions[Keybinds.functions?.[inputKey]] !== undefined
        ) {
          Key.functions[Keybinds.functions?.[inputKey]]();
        }

        if (start && inputKey !== "Escape" && alive) {
          alive = true;
          start = false;
          directionHandler();
          updateDirection();
          SnakeSegments.pop();
          manageSnakeSegments(Snake.x, Snake.y);
          update();
        }
      }

      document.addEventListener("mousedown", function (e) {
        startTouch(e);
        keyHandler("LMB", true);
      });

      document.addEventListener("touchstart", function (e) {
        //canvas.focus();
        startTouch(e.touches[0]);
      });

      function startTouch(e) {
        touch.lastpos = touch.currentpos = {
          x: e.clientX,
          y: e.clientY,
        };
      }

      document.addEventListener("mousemove", function (e) {
        if (Key.state.swipe) {
          calcDir(e);
        }
      });

      document.addEventListener("touchmove", function (e) {
        calcDir(e.touches[0]);
      });

      document.addEventListener("mouseup", function () {
        keyHandler("LMB", false);
      });

      function calcDir(e) {
        touch.currentpos = {
          x: e.clientX,
          y: e.clientY,
        };
        let difference = {
          x: touch.currentpos.x - touch.lastpos.x,
          y: touch.currentpos.y - touch.lastpos.y,
        };
        if (
          Math.abs(difference.x) < settings.controls.swipeThreshold.val &&
          Math.abs(difference.y) < settings.controls.swipeThreshold.val
        ) {
          return;
        }

        touch.lastpos = touch.currentpos;
        keyHandler(
          Math.abs(difference.x) > Math.abs(difference.y)
            ? difference.x < 0
              ? "KeyA"
              : "KeyD"
            : difference.y < 0
              ? "KeyW"
              : "KeyS",
          true,
        );
      }

      //Menu

      function createElements(elementArr, parentObj, replaceBool = true) {
        if (replaceBool) {
          parentObj.replaceChildren();
        }
        let tempCounter = 0;
        for (const element of elementArr) {
          let tempElement = document.createElement(element.elementType);

          element?.id
            ? (tempElement.id = element.id)
            : console.error(new Error(`no Id: ${JSON.stringify(element)}`));

          for (const property in element) {
            switch (property) {
              case "elementType": {
                break;
              }
              case "id": {
                break;
              }
              case "children": {
                break;
              }
              case "text": {
                tempElement.innerText = element[property];
                break;
              }
              case "className": {
                tempElement.className = element[property];
                break;
              }
              case property.startsWith("on") ? property : null: {
                //on rule expand later
                console.log(property);
                tempElement[`${property}`] = element[property];
                break;
              }

              default:
                tempElement.setAttribute(property, element[property]);
            }
          }

          if (element?.children) {
            createElements(element.children, tempElement, false);
          }
          parentObj.append(tempElement);

          tempCounter++;
        }
      }

      class menuButtonJs {
        static id = 0;
        constructor(text, onclick, hidden = false) {
          this.elementType = "button";
          this.text = text;
          this.className = "menuButton";
          this.onclick = onclick;
          this.id = `button_${menuButtonJs.id++}`;
          if (hidden) {
            this.hidden = "true";
          }
        }
      }

      class inputButton {
        static id = 0;
        constructor(text, onclick, val) {
          this.elementType = "div";
          this.className = "wrapper state0";
          this.id = `inputButton_${inputButton.id}`;

          this.children = [
            new menuButtonJs(
              `${text}${val !== undefined ? ": " + (Number(val) === val ? (val < 999 ? (val < 9.4 ? Math.round(val * 100) / 100 : Math.round(val)) : 999) : val) : ""}`,
              () => {
                this.toggleHide();
              },
            ),
            {
              elementType: "input",
              className: "menuButton input",
              placeholder: text,
              id: `input_${inputButton.id}`,
            },
            new menuButtonJs("Ok", (e) => {
              this.toggleHide();
              let newVal = getInputText(e, "Number", false);
              document.getElementById(this.children[0].id).innerText =
                `${text}${newVal !== undefined ? ": " + (Number(newVal) === newVal ? (newVal < 999 ? (newVal < 9.4 ? Math.round(newVal * 100) / 100 : Math.round(newVal)) : 999) : val) : ""}`;

              onclick(e);
            }),
          ];
          inputButton.id++;
        }
        toggleHide() {
          document.getElementById(this.id).className =
            document.getElementById(this.id).className === "wrapper state0"
              ? "wrapper state1"
              : "wrapper state0";
        }
      }

      class chooseButton {
        static id = 0;
        constructor(onclick) {
          this.elementType = "div";
          this.id = `chooseButton_${chooseButton.id++}`;

          this.className = "chooseButtonDiv";

          this.children = [
            { elementType: "p", id: "chooseButtonText", text: "Apples: " },
            {
              elementType: "div",
              id: `${this.id}_buttonDiv_0`,
              children: [
                {
                  elementType: "button",
                  id: "1",
                  class: "",
                  onclick: (e) => {
                    this.switchButton(e.target.id);
                    onclick(1, "count", settings.game.apples);
                  },
                  text: "1",
                },
                {
                  elementType: "button",
                  id: "5",
                  class: "",
                  onclick: (e) => {
                    this.switchButton(e.target.id);
                    onclick(5, "count", settings.game.apples);
                  },
                  text: "5",
                },
              ],
            },
            {
              elementType: "div",
              id: `${this.id}_buttonDiv_1`,
              children: [
                {
                  elementType: "button",
                  id: "hydra",
                  class: settings.game.apples.hydra ? "selected" : "",
                  onclick: (e) => {
                    this.switchButton(e.target.id);
                    onclick(
                      !settings.game.apples.hydra,
                      "hydra",
                      settings.game.apples,
                    );
                    onclick(1, "count", settings.game.apples);
                  },
                  text: "Hydra",
                },
              ],
            },
          ];

          this.children[1].children[
            `${settings.game.apples.count === 1 ? 0 : 1}`
          ].className = "selected";
        }
        switchButton(elementId) {
          console.log(document.getElementById(elementId));
          switch (elementId) {
            case "hydra":
              console.log("hydra");
              document.getElementById("hydra").className =
                document.getElementById("hydra").className === ""
                  ? "selected"
                  : "";
              break;

            case "1":
              console.log(1);
              document.getElementById("5").className = "";

            case "5":
              console.log(5);
              document.getElementById("1").className = "";

            default:
              document.getElementById(elementId).className = "selected";
          }
        }
      }

      class slider {
        static id = 0;
        constructor(text, obj, val) {
          //max,min,step
          this.elementType = "div";
          this.id = `slider_${slider.id++}`;
          this.className = "sliderContainer";

          this.children = [
            {
              elementType: "p",
              id: `${this.id}_p`,
              text: `${text}: ${" ".repeat(3 - `${obj[val]}`.length)}${obj[val]}`,
            },
            {
              elementType: "input",
              type: "range",
              min: 1,
              max: 100,
              value: obj[val],
              id: `${this.id}_range`,
              oninput: (e) => {
                obj[val] = Number(e.target.value); //TODO Add funtion where f(100) = 10, f(1) = 0.1

                e.target.parentNode.children[0].innerText = `${text}: ${" ".repeat(3 - `${e.target.value}`.length)}${e.target.value}`;
                settings.controls.swipeThreshold.val =
                  (deviceInfo.aspectRatio < canvas.width / canvas.height
                    ? deviceInfo.width
                    : deviceInfo.height) /
                  (1.0112 * 1.047018 ** settings.controls.swipeThreshold.mult -
                    0.0587) /
                  10;
                localStorage.setItem("settings", JSON.stringify(settings));
              },
            },
          ];
        }
      }

      class grid {
        static id = 0;
        constructor(obj) {
          this.elementType = "div";

      function generateSnakeSegments(x, y) {
        if ((x - map.start_x) / map.tile_length < Snake.segmentCount) {
          Snake.x += Snake.segmentCount * map.tile_length - map.start_x;

          let tempSegment = {
            x: Snake.x,
            y: Snake.y,
            angle: Snake.angle,
          };

          let tempSnakeSegments = [tempSegment];

          let abc = 0;

          while (Snake.segmentCount > tempSnakeSegments.length && abc < 200) {
            abc++;
            let segmentDirection;
            let repeatSegmentSpawnAmount;
            if (tempSegment.y === Snake.y) {
              if (tempSegment.x !== map.start_x) {
                segmentDirection = 180;
                repeatSegmentSpawnAmount =
                  (tempSegment.x - map.start_x) / map.tile_length;
              } else {
                if (
                  ((tempSegment.x - map.start_x) / map.tile_length) % 2 ===
                  0
                ) {
                  segmentDirection = 90;

                  repeatSegmentSpawnAmount =
                    ((map.height - tempSegment.y) * 1) / map.tile_length;
                }
              }
            } else {
              if (
                tempSegment.y === map.height ||
                tempSegment.y === Snake.y - map.tile_length
              ) {
                if (
                  ((tempSegment.x - map.start_x) / map.tile_length) % 2 ===
                  0
                ) {
                  segmentDirection = 0;
                  repeatSegmentSpawnAmount = 1;
                } else {
                  segmentDirection = 270;
                  if (
                    tempSegment.x ===
                    map.start_x + map.width - map.tile_length
                  ) {
                    repeatSegmentSpawnAmount =
                      (tempSegment.y - map.start_y) / map.tile_length;
                  } else {
                    if (tempSegment.y === Snake.y - map.tile_length) {
                      repeatSegmentSpawnAmount =
                        (tempSegment.y - map.start_y - map.tile_length) /
                        map.tile_length;
                    } else {
                      repeatSegmentSpawnAmount =
                        (tempSegment.y - Snake.y - map.start_y) /
                        map.tile_length;
                    }
                  }
                }

                //Snake.segmentCount - tempSnakeSegments.length;
              } else {
                if (
                  tempSegment.y === Snake.y + map.tile_length ||
                  tempSegment.y === map.start_y + map.tile_length
                ) {
                  if (
                    ((tempSegment.x - map.start_x) / map.tile_length) % 2 ===
                    0
                  ) {
                    segmentDirection = 90;
                    if (tempSegment.y === map.start_y + map.tile_length) {
                      repeatSegmentSpawnAmount =
                        (Snake.y - tempSegment.y - map.tile_length) /
                        map.tile_length;
                      if (
                        tempSegment.x ===
                        map.start_x + map.width - map.tile_length * 2
                      ) {
                        repeatSegmentSpawnAmount++;
                      }
                    } else {
                      repeatSegmentSpawnAmount =
                        ((map.height - tempSegment.y) * 1) / map.tile_length;
                    }
                  } else {
                    segmentDirection = 0;
                    repeatSegmentSpawnAmount = 1;
                  }
                } else {
                  if (tempSegment.y === map.start_y) {
                    if (
                      tempSegment.x ===
                      map.start_x + map.width - map.tile_length
                    ) {
                      segmentDirection = 180;
                      repeatSegmentSpawnAmount =
                        (tempSegment.x - map.start_x) / map.tile_length;
                    } else {
                      if (tempSegment.x === map.start_x) {
                        segmentDirection = 90;
                        repeatSegmentSpawnAmount =
                          ((Snake.y - tempSegment.y - map.tile_length) * 1) /
                          map.tile_length;
                      }
                    }
                  } else {
                    segmentDirection = 0;
                    repeatSegmentSpawnAmount =
                      Snake.segmentCount - tempSnakeSegments.length;
                  }
                }
              }
            }

            repeatSegmentSpawn(repeatSegmentSpawnAmount, segmentDirection);
          }
          tempSnakeSegments.pop();
          tempSnakeSegments.forEach((element) => {
            manageSnakeSegments(element.x, element.y);
          });

          function repeatSegmentSpawn(amount, segmentDirection) {
            if (amount > Snake.segmentCount) {
              amount = Snake.segmentCount - tempSnakeSegments.length;
            }
            for (let n = 0; n < amount; n++) {
              let tempSegmentAxis =
                segmentDirection === 0 || segmentDirection === 180 ? "x" : "y";
              let invert =
                segmentDirection === 0 || segmentDirection === 90 ? 1 : -1;
              tempSegment[tempSegmentAxis] += map.tile_length * invert;
              tempSnakeSegments.unshift({
                x: tempSegment.x,
                y: tempSegment.y,
                id: n,
              });
            }
          }
        } else {
          for (let n = Snake.segmentCount; n > 0; n--) {
            manageSnakeSegments(Snake.x - map.tile_length * n, y);
          }
        }
      }

      async function defineSettings() {
        let Json = await (await fetch(`${path}default/settings.JSON`)).json();

        if (
          typeof settings !== "object" &&
          settings !== null &&
          !Array.isArray(settings)
        ) {
          settings = {};
        }

        getObjKeys(Json, settings);

        function getObjKeys(referenceObj, brokenObj) {
          Object.entries(referenceObj).forEach((element) => {
            if (
              typeof element[1] === "object" &&
              element[1] !== null &&
              !Array.isArray(element[1])
            ) {
              if (brokenObj?.[element[0]] === undefined) {
                brokenObj[element[0]] = element[1];
                return;
              }
              getObjKeys(element[1], brokenObj[element[0]]);
            } else {
              if (brokenObj[element[0]] == undefined) {
                brokenObj[element[0]] = element[1];
              }
            }
          });
        }

        settings.controls.swipeThreshold.val =
          (deviceInfo.aspectRatio < canvas.width / canvas.height
            ? deviceInfo.width
            : deviceInfo.height) /
          (1.0112 * 1.047018 ** settings.controls.swipeThreshold.mult -
            0.0587) /
          10;
      }

      function update() {
        if (start || (!alive && (tickCounter === 0 || tickCounter >= 10))) {
          return;
        }

        updateloop = setTimeout(
          update,
          (15 * settings.game.speedMult) /
            (settings.game.hardModeMult.on
              ? settings.game.hardModeMult.val
              : 1),
        );

        directionHandler();
        move(Snake);

        if (tickCounter >= map.tile_length) {
          updateDirection();
          checkCollision();

          /*if (
            Apples.length !==
            tiles.filter((element) => element.state === "apple").length
          ) {
            console.error(new Error("idwa"));

              console.log({ Snake, Apples, SnakeSegments, tiles, tickCounter });
              start = true;
            }
          });

          if (adressTiles(Snake.x, Snake.y, "read").state === "apple") {
            eat();
          } else {
            appleGrow = false;
          }
          updateTiles();
          manageSnakeSegments(Snake.x, Snake.y);

          tickCounter = 0;
        }
        tickCounter++;

      function directionHandler() {
        let bufferDirection = Snake.nextAngle;
        if (Key.state.up === true) {
          Snake.nextAngle = 270;
        }
        if (Key.state.down === true) {
          Snake.nextAngle = 90;
        }
        if (Key.state.left === true) {
          Snake.nextAngle = 180;
        }
        if (Key.state.right === true) {
          Snake.nextAngle = 0;
        }

        if (
          bufferDirection !== Snake.nextAngle &&
          Snake.bufferAngle === Snake.angle
        ) {
          directionChange = true;
          Snake.bufferAngle = bufferDirection;
        }
      }

      function getInverseDir(normalDir) {
        return normalDir + 180 < 360 ? normalDir + 180 : normalDir - 180;
      }

      function updateDirection() {
        let wrongDir = getInverseDir(Snake.angle);

        if (
          directionChange &&
          (Snake.nextAngle === Snake.angle ||
            getInverseDir(Snake.nextAngle) === Snake.angle) &&
          Snake.bufferAngle !== getInverseDir(Snake.angle)
        ) {
          Snake.angle = Snake.bufferAngle;
        } else {
          if (Snake.nextAngle !== wrongDir) {
            directionChange = false;
            Snake.angle = Snake.nextAngle;
            Snake.bufferAngle = Snake.angle;
          }
        }
      }

      function move(obj) {
        if (!obj?.last) {
          obj.last = { x: obj.x, y: obj.y };
        }
        switch (obj.angle) {
          case 0:
            obj.x = obj.last.x + tickCounter;
            break;
          case 90:
            obj.y = obj.last.y + tickCounter;
            break;
          case 180:
            obj.x = obj.last.x - tickCounter;
            break;
          case 270:
            obj.y = obj.last.y - tickCounter;
            break;
        }
        if (tickCounter === 10 && (obj.x % 10 !== 0 || obj.y % 10 !== 0)) {
          console.log(obj.x % 10 !== 0 || obj.y % 10 !== 0);
          console.error(new Error("x: " + Obj.x + ", y: " + Obj.y));
          Apples.forEach((apple, index) => {
            let msg = adressTiles(apple.x, apple.y, "read").state;
            if (msg !== "apple") {
              console.error(
                new Error(`State: ${msg} and index of apple: ${index}`),
              );

              console.log({ Snake, Apples, SnakeSegments, tiles });
            }
          });
          alert("BUG");
        }
      }

      function checkCollision() {
        checkBodyCollision = () => {
          if (
            adressTiles(Snake.x, Snake.y, "read").state === "segment" &&
            !(
              Snake.x === SnakeSegments[0].last.x &&
              Snake.y === SnakeSegments[0].last.y
            )
          ) {
            dead();
          }
        };
        if (Snake.x > map.start_x + map.width - map.tile_length) {
          if (settings.game.walls) {
            dead();
          } else {
            Snake.x -= map.width;
          }
          checkBodyCollision();
          return;
        }
        if (Snake.x < map.start_x) {
          if (settings.game.walls) {
            dead();
          } else {
            Snake.x += map.width;
          }
          checkBodyCollision();
          return;
        }
        if (Snake.y > map.start_y + map.height - map.tile_length) {
          if (settings.game.walls) {
            dead();
          } else {
            Snake.y -= map.height;
          }
          checkBodyCollision();
          return;
        }
        if (Snake.y < map.start_y) {
          if (settings.game.walls) {
            dead();
          } else {
            Snake.y += map.height;
          }
          checkBodyCollision();
          return;
        }
        checkBodyCollision();
      }

      class SnakeSegmentConstructor {
        constructor(x, y) {
          this.x = x;
          this.y = y;

          this.angle = Snake.angle;
          this.angle_b;
          this.width = map.tile_length;
          this.height = map.tile_length;
          this.src = `${path}textures/Spreadsheet.png`;
          this.srcCoords = this.calcTexture();
          this.img = new Image();
          this.img.src = this.src;
          adressTiles(x, y, "segment");
        }
        calcTexture() {
          let previousAngle = SnakeSegments[SnakeSegments.length - 1]?.angle;
          if (this.angle === previousAngle) {
            return { x: 10, y: 10 };
          } else {
            if (
              (this.angle === 0 && previousAngle === 270 ? 360 : this.angle) <
              (previousAngle === 0 && this.angle === 270 ? 360 : previousAngle)
            ) {
              this.width = -1 * map.tile_length;
            }
            return { x: 0, y: 10 };
          }
        }
      }

      function manageSnakeSegments(x, y) {
        SnakeSegments.push(new SnakeSegmentConstructor(x, y));
        if (SnakeSegments.length > Snake.segmentCount) {
          let oldSegment = SnakeSegments.shift();
          adressTiles(
            oldSegment?.last === undefined ? oldSegment.x : oldSegment.last.x,
            oldSegment?.last === undefined ? oldSegment.y : oldSegment.last.y,
            "free",
          );
        }
      }

      function updateTiles() {
        Snake.last.x = Snake.x;
        Snake.last.y = Snake.y;
        if (
          adressTiles(
            SnakeSegments[SnakeSegments.length - 1].x,
            SnakeSegments[SnakeSegments.length - 1].y,
            "read",
          ).state === "apple"
        ) {
          alive = false;
          console.log(Snake.x, Snake.y, "read");
        }
        adressTiles(Snake.x, Snake.y, "head");
      }

      class Apple {
        constructor(pos) {
          if (!pos) {
            let freeTiles = tiles.filter((tileObj) => tileObj.state === "free");
            pos = freeTiles[Math.floor(Math.random() * freeTiles.length)];
            this.x = pos.x + map.start_x;
            this.y = pos.y + map.start_y;
          } else {
            this.x = pos.x;
            this.y = pos.y;
          }
          this.width = map.tile_length;
          this.height = map.tile_length;
          this.angle = 0;
          this.src = `${path}textures/Strawberry.png`;
          this.srcCoords = { x: 0, y: 0 };
          this.img = new Image();

          this.img.src = this.src;
          /*console.log({
            x: adressTiles(this.x, this.y, "read").x,
            y: adressTiles(this.x, this.y, "read"),
            S_X: Snake.x,
            S_Y: Snake.y,
          });*/
          adressTiles(this.x, this.y, "apple");
        }
      }

      function eat() {
        Apples = Apples.filter((element, index) =>
          element.x === Snake.x && element.y === Snake.y ? false : true,
        );

        Snake.segmentCount++;
        appleGrow = true;
        document.getElementById("score").textContent =
          (Snake.segmentCount - Snake.startSegmentCount) /
          settings.game.speedMult;

        if (
          tiles.filter(
            (tileObj) => tileObj.state === "free" || tileObj.state === "apple",
          ).length <= 1
        ) {
          alert("U WIN!!!");
          alive = false;
          Apples = [];
        } else {
          if (
            tiles.filter((tileObj) => tileObj.state === "free").length !== 0
          ) {
            Apples.push(new Apple(null));
            if (
              tiles.filter((tileObj) => tileObj.state === "free").length !==
                0 &&
              settings.game.apples.hydra
            ) {
              Apples.push(new Apple(null));
            }
          }
        }
        if (settings.game.hardModeMult.val < 2 && true) /*hard mode is on*/ {
          settings.game.hardModeMult.val += 0.04;
        }
      }

      function adressTiles(x, y, state) {
        //xy in px
        if (x % 10 !== 0 || y % 10 !== 0) {
          console.error("em");
        }
        let targetTile =
          tiles[
            (((x - map.start_x) / map.tile_length) * map.height) /
              map.tile_length +
              (y - map.start_y) / map.tile_length
          ];
        if (state === "read") {
          return targetTile;
        } else {
          if (targetTile === undefined) {
            //canvas.setAttribute("style", "background-color:#ff0000");
            console.log(targetTile, x, y, state);
          } else {
            targetTile.state = state;
          }
        }
      }

      function dead() {
        alive = false;
        start = false;
        Snake.nextAngle = "none";
        mainMenu();
        menuButtonJs.id = 0;
        createElements(
          [
            new menuButtonJs("Main Menu", function () {
              newGame();
              pauseGame();
              mainMenu();
            }),
            new inputButton("LeaderBoardEntry", (e) =>
              leaderBoardEntry(getInputText(e, "string")),
            ),
            new menuButtonJs("New Game", newGame),
            /*{
              elementType: "div",
              className: "wrapper confirm",
              children: [
                {
                  elementType: "input",
                  placeholder: "hi",
                  className: "menuButton input",
                },
                new menuButtonJs("ok"),
              ],
            },*/
            /*new tableAssembler("gameStats", [
                    ["Rank", "", "smth"],
                    ["Score", "", "smth"],
                    ["ApplesEaten", "", "smth"],
                  ]),*/
          ],
          css.mainMenu.buttonDiv,
        );
        css.menuText.innerText = "You Died";
      }

      //Draw

      function loadImages() {
        backgroundImage.src = `${path}textures/Background.png`;
        Snake.img = new Image();
        Snake.img.src = Snake.src;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(backgroundImage, 0, 0);

        //ctx.fillRect(map.start_x, map.start_y, map.width, map.height);

        rotate(SnakeSegments[0], {
          x: 20,
          y: 0,
          angle: getInverseDir(SnakeSegments[0].angle),
        });
        rotate(SnakeSegments[1], {
          x: 0,
          y: 0,
          angle: getInverseDir(SnakeSegments[1].angle),
        });
        for (let n = 2; n < SnakeSegments.length - 1; n++) {
          rotate(SnakeSegments[n]);
        }
        rotate(SnakeSegments[SnakeSegments.length - 1], {
          x: 0,
          y: 0,
          angle: SnakeSegments[SnakeSegments.length - 2].angle,
        });

        Apples.forEach((element) => {
          rotate(element);
        });

        ctx.fillStyle = "#FF6A00";
        rotate(Snake);
        if (!appleGrow) {
          move(SnakeSegments[0]);
        }

        if (settings.dev.touchbox) {
          let aspectRatioRatio;
          ctx.fillRect(
            screenToCanvasPx("width"),
            screenToCanvasPx("height"),

            swipeThresholdButForCanvas("width") * 2,
            swipeThresholdButForCanvas("height") * 2,
          );

          function screenToCanvasPx(dir) {
            aspectRatioRatio =
              dir === "height"
                ? canvas.width /
                  canvas.height /
                  (deviceInfo.width / deviceInfo.height)
                : deviceInfo.width /
                  deviceInfo.height /
                  (canvas.width / canvas.height);

            let calc =
              ((touch.lastpos[dir === "width" ? "x" : "y"] * canvas[dir]) /
                deviceInfo[dir]) *
              ((dir === "width" || dir === "height") && aspectRatioRatio > 1
                ? aspectRatioRatio
                : 1);

            //calc ratio right

            calc -=
              aspectRatioRatio > 1
                ? (canvas[dir] * (aspectRatioRatio - 1)) / 2
                : 0;

            //calc at mousepointer

            calc -= swipeThresholdButForCanvas();

            return calc;
          }
          function swipeThresholdButForCanvas() {
            return (
              settings.controls.swipeThreshold.val *
              (canvas.width /
                canvas.height /
                (deviceInfo.width / deviceInfo.height) <
              1
                ? canvas.width /
                  (canvas.width /
                    canvas.height /
                    (deviceInfo.width / deviceInfo.height)) /
                  deviceInfo.width
                : (canvas.height *
                    (canvas.width /
                      canvas.height /
                      (deviceInfo.width / deviceInfo.height))) /
                  deviceInfo.height)
            );
          }
        }

        requestAnimationFrame(draw);

        function rotate(
          imgObj,
          extraObj = {
            x: imgObj.srcCoords.x,
            y: imgObj.srcCoords.y,
            angle: imgObj.angle,
          },
        ) {
          ctx.save();
          ctx.translate(imgObj.x, imgObj.y);
          ctx.rotate((extraObj.angle * Math.PI) / 180);
          ctx.translate(
            extraObj.angle >= 180 ? -1 * map.tile_length : 0,
            extraObj.angle <= 180 && extraObj.angle !== 0
              ? -1 * map.tile_length
              : 0,
          );

          ctx.scale(
            imgObj.height / map.tile_length,
            imgObj.width / map.tile_length,
          );
          ctx.translate(
            imgObj.height < 0 ? imgObj.height : 0,
            imgObj.width < 0 ? imgObj.width : 0,
          );
          if (imgObj === Snake) {
            ctx.fillRect(7, 1, -tickCounter, 8);
          }
          if (imgObj === SnakeSegments[0]) {
            ctx.fillRect(
              3,
              1,
              appleGrow ? 0 : tickCounter - map.tile_length,
              8,
            );
          }

          ctx.drawImage(
            imgObj.img,
            extraObj.x,
            extraObj.y,
            map.tile_length,
            map.tile_length,
            0,
            0,
            map.tile_length,
            map.tile_length,
          );

          ctx.restore();
        }
      }
      debugCounter = { true: 0, false: 0 };
